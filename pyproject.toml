[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.2.0"
description = "Maze generator and Textual visualizer for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "jbarthel" },
  { name = "oguizol" }
]
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "textual>=0.50.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<25.0",
    "flake8>=7.0,<8.0",
    "mypy>=1.10,<2.0",
    "build>=1.0,<2.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
py-modules = ["mazegen"]

[tool.mypy]
exclude = [
    ".venv",
    "venv",
    "dist",
    "build",
    ".mypy_cache",
    ".pytest_cache",
    ".*\\.egg-info",
    "graphic_visualizer"
]

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["graphic_visualizer"]
disable_error_code = ["misc"]

[tool.black]
line-length = 79
extend-exclude = ".venv"
